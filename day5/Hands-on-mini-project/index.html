<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 Mini Project - To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-card">
            <h1>Simple To-Do List</h1>
            <p class="subtitle">Use functions to add, show, delete, and complete tasks.</p>

            <div class="input-group">
                <input id="taskInput" type="text" placeholder="Enter a new task" />
                <button onclick="addTaskFromInput()" class="primary-btn">Add Task</button>
            </div>

            <div class="todo-actions">
                <button onclick="showTasks()" class="secondary-btn">Show Tasks</button>
            </div>

            <div class="task-list" id="taskList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
