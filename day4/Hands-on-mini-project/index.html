<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game - Day 4 Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>Number Guessing Game</h1>
            <p class="subtitle">Guess the secret number between 1 and 10. You have 5 attempts.</p>

            <div class="input-group">
                <label for="guessInput">Your guess</label>
                <input type="number" id="guessInput" min="1" max="10" placeholder="Enter a number" value="5">
            </div>

            <button onclick="submitGuess()" class="primary-btn">Submit Guess</button>
            <button onclick="resetGame()" class="secondary-btn">Restart Game</button>

            <div class="status-panel">
                <div id="message" class="message">Press submit to start guessing.</div>
                <div id="attempts" class="attempts">Attempts left: 5</div>
            </div>

            <div class="result-panel" id="resultPanel"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
