<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake API Data Fetcher - Day 8 Mini Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .controls {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .controls h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .method-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .method-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .method-btn.active {
            background: #667eea;
            color: white;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .section h3 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .user-card {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .user-card:hover {
            transform: translateX(5px);
            background: #f0f0f0;
        }
        
        .user-card p {
            margin: 8px 0;
            color: #666;
            font-size: 0.95em;
        }
        
        .user-card strong {
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #c62828;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #2e7d32;
            margin-bottom: 15px;
        }
        
        .code-example {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin-bottom: 15px;
        }
        
        .posts-section {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .post-card {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #764ba2;
        }
        
        .post-card h4 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1em;
        }
        
        .post-card p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Fake API Data Fetcher</h1>
            <p>Day 8 - Async JavaScript Mini Project</p>
            <p style="font-size: 0.9em; margin-top: 10px;">Learn Promises vs Async/Await with JSONPlaceholder API</p>
        </header>
        
        <div class="controls">
            <h2>📌 Comparison: Promises vs Async/Await</h2>
            
            <div class="method-toggle">
                <button class="method-btn active" onclick="setMethod('promises')">
                    📦 Promises (.then().catch())
                </button>
                <button class="method-btn" onclick="setMethod('asyncawait')">
                    ⚡ Async/Await
                </button>
            </div>
            
            <div class="button-group">
                <button onclick="fetchUsers()">👥 Fetch Users</button>
                <button onclick="fetchPosts()">📝 Fetch Posts</button>
                <button onclick="fetchComments()">💬 Fetch Comments</button>
                <button onclick="clearAll()">🗑️ Clear All</button>
            </div>
            
            <div class="code-example" id="codeExample" style="display: none;"></div>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>👥 Users</h2>
                <div id="usersContainer"></div>
            </div>
            
            <div class="section">
                <h2>📝 Posts</h2>
                <div id="postsContainer"></div>
            </div>
        </div>
        
        <div class="section">
            <h2>💬 Comments</h2>
            <div id="commentsContainer"></div>
        </div>
    </div>

    <script>
        let currentMethod = 'promises';
        
        function setMethod(method) {
            currentMethod = method;
            
            // Update button states
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show code example
            showCodeExample(method);
        }
        
        function showCodeExample(method) {
            const codeDiv = document.getElementById('codeExample');
            codeDiv.style.display = 'block';
            
            if (method === 'promises') {
                codeDiv.innerHTML = `
                    <strong>Promises Approach (.then().catch())</strong><br><br>
                    fetch(url)<br>
                    &nbsp;.then(response => response.json())<br>
                    &nbsp;.then(data => console.log(data))<br>
                    &nbsp;.catch(error => console.error(error))
                `;
            } else {
                codeDiv.innerHTML = `
                    <strong>Async/Await Approach</strong><br><br>
                    async function getData() {<br>
                    &nbsp;const response = await fetch(url);<br>
                    &nbsp;const data = await response.json();<br>
                    &nbsp;console.log(data);<br>
                    }
                `;
            }
        }
        
        function showLoading(containerId) {
            document.getElementById(containerId).innerHTML = 
                '<div class="loading"><div class="spinner"></div>Loading...</div>';
        }
        
        function showError(containerId, error) {
            document.getElementById(containerId).innerHTML = 
                `<div class="error">❌ Error: ${error}</div>`;
        }
        
        // ====== PROMISES VERSION ======
        function fetchUsersPromises() {
            showLoading('usersContainer');
            
            fetch('https://jsonplaceholder.typicode.com/users')
                .then(response => response.json())
                .then(users => {
                    let html = '<div class="success">✅ Fetched with Promises!</div>';
                    users.forEach(user => {
                        html += `
                            <div class="user-card">
                                <p><strong>${user.name}</strong></p>
                                <p>📧 ${user.email}</p>
                                <p>📱 ${user.phone}</p>
                                <p>🌐 ${user.website}</p>
                            </div>
                        `;
                    });
                    document.getElementById('usersContainer').innerHTML = html;
                })
                .catch(error => showError('usersContainer', error.message));
        }
        
        function fetchPostsPromises() {
            showLoading('postsContainer');
            
            fetch('https://jsonplaceholder.typicode.com/posts?_limit=5')
                .then(response => response.json())
                .then(posts => {
                    let html = '<div class="success">✅ Fetched with Promises!</div><div class="posts-section">';
                    posts.forEach(post => {
                        html += `
                            <div class="post-card">
                                <h4>📌 ${post.title}</h4>
                                <p>${post.body}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('postsContainer').innerHTML = html;
                })
                .catch(error => showError('postsContainer', error.message));
        }
        
        function fetchCommentsPromises() {
            showLoading('commentsContainer');
            
            fetch('https://jsonplaceholder.typicode.com/comments?_limit=8')
                .then(response => response.json())
                .then(comments => {
                    let html = '<div class="success">✅ Fetched with Promises!</div><div class="posts-section">';
                    comments.forEach(comment => {
                        html += `
                            <div class="post-card">
                                <h4>💬 ${comment.name}</h4>
                                <p><strong>From:</strong> ${comment.email}</p>
                                <p>${comment.body}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('commentsContainer').innerHTML = html;
                })
                .catch(error => showError('commentsContainer', error.message));
        }
        
        // ====== ASYNC/AWAIT VERSION ======
        async function fetchUsersAsync() {
            showLoading('usersContainer');
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                
                let html = '<div class="success">✅ Fetched with Async/Await!</div>';
                users.forEach(user => {
                    html += `
                        <div class="user-card">
                            <p><strong>${user.name}</strong></p>
                            <p>📧 ${user.email}</p>
                            <p>📱 ${user.phone}</p>
                            <p>🌐 ${user.website}</p>
                        </div>
                    `;
                });
                document.getElementById('usersContainer').innerHTML = html;
            } catch (error) {
                showError('usersContainer', error.message);
            }
        }
        
        async function fetchPostsAsync() {
            showLoading('postsContainer');
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
                const posts = await response.json();
                
                let html = '<div class="success">✅ Fetched with Async/Await!</div><div class="posts-section">';
                posts.forEach(post => {
                    html += `
                        <div class="post-card">
                            <h4>📌 ${post.title}</h4>
                            <p>${post.body}</p>
                        </div>
                    `;
                });
                html += '</div>';
                document.getElementById('postsContainer').innerHTML = html;
            } catch (error) {
                showError('postsContainer', error.message);
            }
        }
        
        async function fetchCommentsAsync() {
            showLoading('commentsContainer');
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/comments?_limit=8');
                const comments = await response.json();
                
                let html = '<div class="success">✅ Fetched with Async/Await!</div><div class="posts-section">';
                comments.forEach(comment => {
                    html += `
                        <div class="post-card">
                            <h4>💬 ${comment.name}</h4>
                            <p><strong>From:</strong> ${comment.email}</p>
                            <p>${comment.body}</p>
                        </div>
                    `;
                });
                html += '</div>';
                document.getElementById('commentsContainer').innerHTML = html;
            } catch (error) {
                showError('commentsContainer', error.message);
            }
        }
        
        // ====== UNIFIED INTERFACE ======
        function fetchUsers() {
            if (currentMethod === 'promises') {
                fetchUsersPromises();
            } else {
                fetchUsersAsync();
            }
        }
        
        function fetchPosts() {
            if (currentMethod === 'promises') {
                fetchPostsPromises();
            } else {
                fetchPostsAsync();
            }
        }
        
        function fetchComments() {
            if (currentMethod === 'promises') {
                fetchCommentsPromises();
            } else {
                fetchCommentsAsync();
            }
        }
        
        function clearAll() {
            document.getElementById('usersContainer').innerHTML = '';
            document.getElementById('postsContainer').innerHTML = '';
            document.getElementById('commentsContainer').innerHTML = '';
        }
        
        // Show initial code example
        showCodeExample('promises');
    </script>
</body>
</html>
